const go=i=>{ix=i;car.scrollTo({left:i*car.clientWidth,behavior:"smooth"})},mark=()=>{const i=Math.round(car.scrollLeft/car.clientWidth);[...dots.children].forEach((d,k)=>d.classList.toggle("on",k===i));ix=i};
S.biz.forEach((b,i)=>{const a=h("a","sl");a.href="#/b/"+b.id;const f=b.items.find(x=>!x.sold)||b.items[0],im=h("img");im.src=(f&&safeImg(f.img))||ph(b.name);im.alt=b.name;const o=h("div","ov");o.append(h("span","eyebrow",b.tag),h("h3","",b.name),h("p","",b.sells),h("span","btn p","Shop now"));a.append(im,o);car.append(a);const d=h("button","dot");d.setAttribute("aria-label","Show "+b.name);d.addEventListener("click",()=>go(i));dots.append(d)});
car.addEventListener("scroll",mark);if(!matchMedia("(prefers-reduced-motion:reduce)").matches)timer=setInterval(()=>go((ix+1)%S.biz.length),4500);setTimeout(mark,0);w.append(car,dots);return w}
function home(){const f=document.createDocumentFragment(),s=h("section","hero"),w=h("div","wrap");
w.append(h("p","eyebrow","CYBERJAY Holdings \u00b7 Nairobi"));
const t=h("h1");t.append("One house.",document.createElement("br"));t.append(h("em","",S.biz.length+" businesses."));
w.append(t,h("p","lead","Browse what is on sale, build your shopping list, and finish the purchase on WhatsApp with the business owner."));
const r=h("div","row"),b1=h("button","btn p","Explore businesses");b1.dataset.scroll="biz";b1.append(ic("ar"));const a2=h("a","btn g","Business login");a2.href="#/chamber";a2.prepend(ic("lk"));r.append(b1,a2);w.append(r,slider());s.append(w);
const sh=h("section","sheet");sh.id="biz";const sw=h("div","wrap"),hd=h("div","sh");hd.append(h("h2","","Our businesses"),h("p","","Each business runs its own storefront, stock and contact line under the CYBERJAY name."));
const g=h("div","grid");S.biz.forEach((b,i)=>{const a=h("a","card slot");a.href="#/b/"+b.id;a.append(h("span","num","0"+(i+1)),h("h3","",b.name),h("span","chip",b.tag),h("p","",b.sells),h("span","chip",stats(b).i.length+" in stock"));const go=h("span","go","Visit business");go.append(ic("ar"));a.append(go);g.append(a)});
sw.append(hd,g);sh.append(sw);f.append(s,sh);return f}
function tog(b,x){const a=cart[b.id]=cart[b.id]||[],i=a.indexOf(x.id);if(i<0)a.push(x.id);else a.splice(i,1);route(true)}
function cartCard(b){const its=(cart[b.id]||[]).map(i=>b.items.find(x=>x.id===i)).filter(x=>x&&!x.sold);if(!its.length)return null;
const c=h("div","card cart");c.append(h("h3","","Your shopping list"));its.forEach(x=>{const r=h("div","svc");r.append(h("b","",x.n+" \u00b7 "+kes(x.p)));const rm=h("button","btn g","Remove");rm.addEventListener("click",()=>tog(b,x));r.append(rm);c.append(r)});
const tot=its.reduce((a,x)=>a+x.p,0);c.append(h("p","pr","Total: "+kes(tot)));
const msg="Hello "+b.name+", I would like to buy:\n"+its.map((x,i)=>(i+1)+". "+x.n+" - "+kes(x.p)).join("\n")+"\nTotal: "+kes(tot)+"\nPlease advise on transport and payment.";
c.append(ext(wa(b,msg),"Purchase on WhatsApp","wa"," Purchase on WhatsApp","btn p"));return c}
function biz(b){const f=document.createDocumentFragment(),s=h("section","hero"),w=h("div","wrap");
const back=h("a","chip","\u2190 All businesses");back.href="#/";
w.append(back,h("h1","",b.name),h("p","eyebrow",b.tag),h("p","lead",b.sells));
const r=h("div","row");r.append(contact(b,"Hello "+b.name+", I would like to enquire."));w.append(r);
const sb=h("div","sub");[["Services","svc"],["Gallery","gal"]].forEach(([l,id])=>{const x=h("button","btn g",l);x.dataset.scroll=id;sb.append(x)});w.append(sb);s.append(w);
const s1=h("section","sheet");s1.id="svc";const w1=h("div","wrap"),d=h("div","card det");
[["Business",b.name],["CEO",b.ceo],["Category",b.tag],["Location",b.loc],["Open",b.hrs],["Since",b.since]].forEach(([k,v])=>{const e=h("div");e.append(h("span","mut",k),h("b","",v));d.append(e)});
const h1=h("div","sh");h1.append(h("h2","","Services"),h("p","","Tap a service to request it directly."));w1.append(d,h1);
(b.services&&b.services.length?b.services:["Ask about our products and services"]).forEach(v=>{const e=h("div","svc");e.append(h("b","",v),ext(wa(b,"Hello "+b.name+", I need: "+v),"Request "+v+" on WhatsApp","wa","Request","btn g"));w1.append(e)});s1.append(w1);
const s2=h("section","sheet alt");s2.id="gal";const w2=h("div","wrap"),h2=h("div","sh");h2.append(h("h2","","On sale"),h("p","","Tap Add to list on anything you want, then purchase on WhatsApp. Sold items stay visible with a SOLD stamp."));w2.append(h2);
const cc=cartCard(b);if(cc)w2.append(cc);
const g=h("div","gal"),inl=(cart[b.id]||[]);[...b.items].sort((a,c)=>a.sold-c.sold||c.t-a.t).forEach(i=>{const c=h("article","card it"+(i.sold?" sold":"")),p=h("div","pic"),im=h("img");im.src=safeImg(i.img)||ph(i.n);im.alt=i.n+(i.sold?" (sold)":"");im.loading="lazy";im.decoding="async";p.append(im);
if(i.sold){const m=h("div","mark");m.append(h("span","","SOLD"));p.append(m)}
const n=h("div","inf");n.append(h("h4","",i.n),h("span","pr",kes(i.p)));
if(i.sold)n.append(h("span","chip","No longer available"));else{const a=inl.includes(i.id),x=h("button","btn "+(a?"g":"p"),a?"Added \u2713 Remove":"Add to list");x.addEventListener("click",()=>tog(b,i));n.append(x)}
c.append(p,n);g.append(c)});w2.append(g);s2.append(w2);f.append(s,s1,s2);return f}
function about(){const f=document.createDocumentFragment(),s=h("section","hero"),w=h("div","wrap");w.append(h("p","eyebrow","About"),h("h1","","CYBERJAY Holdings"),h("p","lead","CYBERJAY Holdings is the parent company behind a family of Nairobi businesses. It began with network, systems and security work and now hosts independent storefronts under one trusted name."));s.append(w);
const sh=h("section","sheet"),sw=h("div","wrap"),g=h("div","cols");
[["Trust first","Direct contact with each owner. No middlemen, no hidden checkout."],["Honest stock","Items are stamped SOLD the moment they go, so you never chase a ghost listing."],["Private by design","The public pages take no payments and collect nothing about visitors."]].forEach(([a,b])=>{const c=h("div","card");c.append(h("h3","",a),h("p","mut",b));g.append(c)});
sw.append(g);sh.append(sw);f.append(s,sh);return f}

/* ---------- chamber (Supabase auth; the database rules enforce who can change what) ---------- */
const bump=()=>{clearTimeout(idle);if(me)idle=setTimeout(async()=>{await sb.auth.signOut();me=null;paint()},6e5)};
addEventListener("click",bump);addEventListener("keydown",bump);
function form(fs,btn,fn){const c=h("div","card frm"),m=h("p","err"),ins={};m.setAttribute("role","status");
fs.forEach(([k,l,t,v])=>{const lb=h("label","",l),i=h("input");i.type=t||"text";i.autocomplete=t==="password"?"current-password":"off";if(t==="number"){i.min=0;i.step=1}else if(t==="file")i.accept="image/jpeg,image/png,image/webp";else i.maxLength=200;if(v!=null&&t!=="file"&&t!=="password")i.value=v;lb.append(i);c.append(lb);ins[k]=i});
const b=h("button","btn p",btn);b.addEventListener("click",async()=>{const o={};for(const k in ins){const i=ins[k];o[k]=i.type==="file"?i.files[0]:i.type==="password"?i.value:i.value.trim()}b.disabled=true;try{await fn(o,m)}catch(e){m.textContent=e.message}b.disabled=false});
c.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.type!=="file")b.click()});c.append(b,m);return c}
const rz=f=>new Promise((ok,no)=>{if(!f||!/^image\/(jpeg|png|webp)$/.test(f.type)||f.size>8e6)return no(new Error("Choose a JPG, PNG or WebP photo under 8 MB"));const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,800/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error("Could not process the photo")),"image/jpeg",.75)};i.onerror=()=>no(new Error("Could not read that image"));i.src=r.result};r.onerror=()=>no(new Error("Could not read that file"));r.readAsDataURL(f)});
const nm=(v,l,min,max)=>{if(v.length<min||v.length>max)throw new Error(l+" must be "+min+"-"+max+" characters")};
const price=v=>{const n=Math.round(Number(v));if(v===""||!Number.isFinite(n)||n<0||n>1e9)throw new Error("Enter a valid price in KES");return n};
const contactCk=o=>{if(!/^\d{10,15}$/.test(o.wa))throw new Error("WhatsApp: digits only with country code, e.g. 2547XXXXXXXX");if(!/^[A-Za-z0-9._]{1,30}$/.test(o.ig))throw new Error("Instagram handle: letters, numbers, . or _")};
const emailOk=v=>/^[^\s@'"]{1,64}@[^\s@'"]{1,190}\.[^\s@'"]{2,}$/.test(v);
async function db(p){const r=await p;if(r.error)throw new Error("Not saved: "+String(r.error.message).slice(0,140));return r}
async function whoami(){const r=await sb.from("profiles").select("role,business_id").maybeSingle();if(r.error||!r.data)return null;const b=S.biz.find(x=>x.uid===r.data.business_id);me={role:r.data.role,biz:b?b.id:null};tab=me.role==="holding"?"biz":"stock";return me}
async function doLogin(e,p){if(!emailOk(e)||!p)throw new Error("Enter your email and password.");
const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)throw new Error("Wrong email or password.");
if(!await whoami()){await sb.auth.signOut();throw new Error("This account is not linked to a business yet. Ask the holding admin.")}bump();paint()}
async function restore(){if(!sb)return;const {data}=await sb.auth.getSession();if(data&&data.session){if(await whoami())bump();else await sb.auth.signOut()}}
function chamber(){const f=document.createDocumentFragment(),s=h("section","hero"),w=h("div","wrap");w.append(h("p","eyebrow","Restricted"),h("h1","","Executive Chamber"),h("p","lead","Business admins manage their own stock here. The holding admin registers businesses."));s.append(w);
const sh=h("section","sheet"),sw=h("div","wrap");sw.id="cw";sw.append(me?room():login());sh.append(sw);f.append(s,sh);return f}
function paint(){const w=$("#cw");if(w)w.replaceChildren(me?room():login())}
function login(){const g=h("div","gate");g.append(h("h3","","Admin login"),form([["e","Email"],["p","Password","password"]],"Log in",o=>doLogin(o.e,o.p)));return g}
const st=(l,v)=>{const c=h("div","card stat");c.append(h("span","chip",l),h("b","",v));return c};
function room(){const hold=me.role==="holding",b=hold?null:S.biz.find(x=>x.id===me.biz);if(!hold&&!b){me=null;return login()}
const w=h("div"),bar=h("div","row bar"),lo=h("button","btn g","Log out");lo.addEventListener("click",async()=>{await sb.auth.signOut();me=null;tip="";paint()});bar.append(h("h3","",hold?"Holding admin \u00b7 CYBERJAY":b.name+" \u00b7 Admin"),lo);
const T=hold?[["biz","Businesses"],["reg","Register business"]]:[["stock","Stock & cash flow"],["add","Add item"],["prof","Profile"]];
if(!T.some(x=>x[0]===tab))tab=T[0][0];
const tb=h("div","sub");T.forEach(([k,l])=>{const x=h("button","btn "+(k===tab?"p":"g"),l);x.addEventListener("click",()=>{tab=k;tip="";paint()});tb.append(x)});
w.append(bar,tb);if(flash){const f=h("p","err",flash);f.setAttribute("role","status");w.append(f);flash=""}
if(tip){const c=h("div","card"),ta=h("textarea");ta.readOnly=true;ta.value=tip;c.append(h("p","mut","Create the owner in Supabase (Authentication > Users > Add user, auto-confirm), then run this in the SQL Editor:"),ta);w.append(c)}
w.append(({stock:()=>stockV(b),add:()=>addV(b),prof:()=>profV(b),biz:bizV,reg:regV})[tab]());return w}
function row(b,x){const r=h("div","svc rw"),im=h("img","th");im.src=safeImg(x.img)||ph(x.n);im.alt="";const m=h("div","gr");m.append(h("b","",x.n),h("small","",x.sold?"Sold "+age(x.s)+" days ago":"Listed "+age(x.t)+" days ago"));
if(!x.sold&&age(x.t)>30)m.append(h("span","chip slow","Slow mover"));
const p=h("input");p.type="number";p.min=0;p.step=1;p.value=x.p;p.setAttribute("aria-label","Price in KES");p.addEventListener("change",async()=>{try{const v=price(p.value);await db(sb.from("items").update({price:v}).eq("id",x.id));x.p=v}catch(e){}p.value=x.p});
const a=h("button","btn g",x.sold?"Restock":"Mark sold");a.addEventListener("click",async()=>{try{await db(sb.from("items").update({sold:!x.sold}).eq("id",x.id));await refresh()}catch(e){flash=e.message}paint()});
const d=h("button","btn g","Delete");d.addEventListener("click",async()=>{if(!confirm("Delete "+x.n+"?"))return;try{await db(sb.from("items").delete().eq("id",x.id));const q=x.img.split("/item-photos/")[1];if(q)sb.storage.from("item-photos").remove([decodeURIComponent(q)]);await refresh()}catch(e){flash=e.message}paint()});
r.append(im,m,p,a,d);return r}
function stockV(b){const s=stats(b),w=h("div"),g=h("div","cols sm");
g.append(st("In stock",s.i.length),st("Sold",s.s.length),st("Stock value",kes(s.val)),st("Cash in (sold)",kes(s.rev)),st("Avg days to sell",s.avg+" d"),st("Slow movers (30d+)",s.slow));
const pv=h("a","btn g","Preview storefront");pv.href="#/b/"+b.id;w.append(g,h("h3","sec","In stock (longest-waiting first)"));
s.i.sort((a,c)=>a.t-c.t).forEach(x=>w.append(row(b,x)));w.append(h("h3","sec","Sold"));s.s.sort((a,c)=>c.s-a.s).forEach(x=>w.append(row(b,x)));w.append(h("p"),pv);return w}
function addV(b){return form([["n","Item name"],["p","Price (KES)","number"],["f","Photo","file"]],"Add to stock",async o=>{nm(o.n,"Name",2,80);const p=price(o.p);let img="";
if(o.f){const blob=await rz(o.f);img=b.uid+"/"+crypto.randomUUID()+".jpg";await db(sb.storage.from("item-photos").upload(img,blob,{contentType:"image/jpeg"}))}
await db(sb.from("items").insert({business_id:b.uid,name:o.n,price:p,img}));await refresh();flash="Item added.";tab="stock";paint()})}
function profV(b){return form([["sells","What you sell","text",b.sells],["svc","Services (comma separated)","text",b.services.join(", ")],["ceo","CEO / owner","text",b.ceo],["loc","Location","text",b.loc],["hrs","Opening hours","text",b.hrs],["since","Since (year)","text",b.since],["wa","WhatsApp (2547XXXXXXXX)","text",b.wa],["ig","Instagram handle","text",b.ig]],"Save profile",async o=>{
nm(o.sells,"Description",3,160);nm(o.ceo,"CEO",2,80);contactCk(o);const services=o.svc.split(",").map(x=>x.trim()).filter(Boolean).slice(0,12);services.forEach(x=>nm(x,"Each service",2,60));
await db(sb.from("businesses").update({sells:o.sells,services,ceo:o.ceo,loc:o.loc,hrs:o.hrs,since:o.since,wa:o.wa,ig:o.ig}).eq("id",b.uid));await refresh();flash="Profile saved.";tab="stock";paint()})}
function bizV(){const w=h("div");S.biz.forEach(b=>{const s=stats(b),c=h("div","card rowc"),a=h("a","btn g","View storefront");a.href="#/b/"+b.id;
c.append(h("h4","",b.name),h("p","mut","CEO: "+b.ceo+" \u00b7 "+b.tag),h("p","mut",s.i.length+" in stock \u00b7 "+s.s.length+" sold \u00b7 cash in "+kes(s.rev)+" \u00b7 stock value "+kes(s.val)),a);w.append(c)});return w}
function regV(){return form([["name","Business name"],["tag","Category"],["sells","What it sells"],["ceo","CEO / owner name"],["loc","Location"],["hrs","Opening hours"],["since","Since (year)"],["wa","WhatsApp (2547XXXXXXXX)"],["ig","Instagram handle"],["email","Owner's login email"],["pw","Owner's temporary password (10+ characters)","password"]],"Register business",async o=>{
nm(o.name,"Business name",2,60);nm(o.tag,"Category",2,60);nm(o.sells,"Description",3,160);nm(o.ceo,"CEO",2,80);contactCk(o);if(!emailOk(o.email))throw new Error("Enter the owner's real email");if(o.pw.length<10)throw new Error("Password needs 10+ characters");
const r=await sb.functions.invoke("create-business",{body:{name:o.name,tag:o.tag,sells:o.sells,ceo:o.ceo,loc:o.loc,hrs:o.hrs,since:o.since,wa:o.wa,ig:o.ig,email:o.email.toLowerCase(),password:o.pw}});
if(r.error){let m="Could not register. Try again.";try{const e=await r.error.context.json();if(e&&e.error)m=e.error}catch(x){}throw new Error(m)}
await refresh();flash=o.name+" registered. Give the owner their email and the temporary password.";tab="biz";paint()})}

/* ---------- router ---------- */
async function route(keep){const id=++rid;clearInterval(timer);const y=scrollY,hs=location.hash.replace(/^#\/?/,"").split("/"),k=hs[0];
if(!keep&&k!=="about"){if(!ready)app.replaceChildren(h("p","load","Loading\u2026"));await refresh();if(id!==rid)return}
if(!ready&&k!=="about"){app.replaceChildren(h("p","load",fail||"Loading\u2026"));return}
let v,n="home";
if(k==="b"){const b=S.biz.find(x=>x.id===hs[1]);if(b){v=biz(b);n="b";document.title=b.name+" | CYBERJAY Holdings"}}
else if(k==="about"){v=about();n="about"}else if(k==="chamber"){v=chamber();n="chamber"}
if(!v){v=home();n="home"}if(n==="home")document.title="CYBERJAY Holdings | Businesses & Marketplace";
app.replaceChildren(v);document.querySelectorAll("#menu a").forEach(a=>a.classList.toggle("on",a.dataset.r===n));
if(keep)scrollTo({top:y,behavior:"instant"});else{scrollTo(0,0);$("#pan").hidden=true}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-scroll]");if(t){const el=document.getElementById(t.dataset.scroll);if(el)el.scrollIntoView({behavior:"smooth"})}});
$("#yr").textContent=new Date().getFullYear();
addEventListener("hashchange",()=>route());
(async()=>{await refresh();await restore();route(true)})();
</script>
</body>
</html>
